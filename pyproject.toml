[project]
name = "coursework-1"
version = "0.1.0"
description = ""
authors = [
    { name = "Natalya Kirpichnikova", email = "kirpichnikova.nb@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.2,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "freezegun (>=1.5.5,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.20.0,<2.0.0)"
]
dev = [
    "pytest-html (>=4.2.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[black]
line-length = 119
exclude = '\.git'

[isort]
line_length = 119
force_single_line = true

[mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "import",
    "from"

]